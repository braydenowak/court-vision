<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Court Vision</title>
</head>
<body>
  <!-- Tabs -->
  <div id="tab-buttons">
    <button onclick="showTab('team-analytics')">Team Analytics</button>
    <button onclick="showTab('player-comparison')">Player Comparison</button>
    <button onclick="showTab('roster-lab')">Roster Lab</button>
  </div>

  <!-- Team Analytics Panel-->
  <div id="team-analytics" class="tab-panel">
    <h1>Court Vision</h1>
    <div id="skatter-axis">
      <label>X axis:
        <select id="x-axis-select" onchange="updateScatter()">
          <option value="Avg PER" selected>Avg PER</option>
          <option value="Avg TS%">Avg TS%</option>
          <option value="Avg USG%">Avg USG%</option>
          <option value="Avg WS/48">Avg WS/48</option>
          <option value="Avg BPM">Avg BPM</option>
          <option value="Total VORP">Total VORP</option>
        </select>
      </label>

      <label>Y axis:
        <select id="y-axis-select" onchange="updateScatter()">
          <option value="Avg PER">Avg PER</option>
          <option value="Avg TS%">Avg TS%</option>
          <option value="Avg USG%">Avg USG%</option>
          <option value="Avg WS/48">Avg WS/48</option>
          <option value="Avg BPM">Avg BPM</option>
          <option value="Total VORP" selected>Total VORP</option>
        </select>
      </label>
    </div>
    

    <svg id="team-scatter" viewBox="0 0 600 400" width="600" height="400"></svg>
    <div id="metric-dropdown">
      <label>Metric:
        <select id="metric-select" onchange="updateRankingChart()">
          <option value="Avg PER" selected>Avg PER</option>
          <option value="Avg TS%">Avg TS%</option>
          <option value="Avg USG%">Avg USG%</option>
          <option value="Avg WS/48">Avg WS/48</option>
          <option value="Total VORP">Total VORP</option>
        </select>
      </label>
    </div>
    <svg id="ranking-chart" width="600"></svg>
    <table id="team-table">
      <thead>
        <tr>
        <th onclick="sortTeamTable('Team')">Team</th>
        <th onclick="sortTeamTable('Players')">Players</th>
        <th onclick="sortTeamTable('Total G')">Total G</th>
        <th onclick="sortTeamTable('Avg MP')">Avg MP</th>
        <th onclick="sortTeamTable('Avg PER')">Avg PER</th>
        <th onclick="sortTeamTable('Avg TS%')">Avg TS%</th>
        <th onclick="sortTeamTable('Avg USG%')">Avg USG%</th>
        <th onclick="sortTeamTable('Total WS')">Total WS</th>
        <th onclick="sortTeamTable('Avg WS/48')">Avg WS/48</th>
        <th onclick="sortTeamTable('Avg BPM')">Avg BPM</th>
        <th onclick="sortTeamTable('Total VORP')">Total VORP</th>
        </tr>
      </thead>
      <tbody id="team-table-body"></tbody>
    </table>
  </div>

  <!-- Player Comparison Panel-->
  <div id="player-comparison" class="tab-panel">
    <h1>Court Vision</h1>
    <div id="player-selectors">
      <select id="player-select-1" onchange="handlePlayerSelectionChange()"></select>
      <select id="player-select-2" onchange="handlePlayerSelectionChange()"></select>
      <select id="player-select-3" onchange="handlePlayerSelectionChange()"></select>
    </div>
    <svg id="radar-chart" viewBox="0 0 500 500" width="500" height="500"></svg>
    <table id = "player-table">
      <thead>
        <tr>
          <th onclick="sortPlayerTable('Player')">Player</th>
          <th onclick="sortPlayerTable('Team')">Team</th>
          <th onclick="sortPlayerTable('Pos')">Pos</th>
          <th onclick="sortPlayerTable('PER')">PER</th>
          <th onclick="sortPlayerTable('TS%')">TS%</th>
          <th onclick="sortPlayerTable('TRB%')">TRB%</th>
          <th onclick="sortPlayerTable('AST%')">AST%</th>
          <th onclick="sortPlayerTable('USG%')">USG%</th>
          <th onclick="sortPlayerTable('WS')">WS</th>
          <th onclick="sortPlayerTable('BPM')">BPM</th>
        </tr>
      </thead>
      <tbody id = "player-table-body"></tbody>
    </table>
  </div>

  <!-- Roster Lab Panel-->
  <div id="roster-lab" class="tab-panel">
    <select id="team-select" onchange="handleTeamChange()"></select>
    <div id="team-fingerprint"></div>
    <div id="removed-chips"></div>
    <div id="roster-list"></div>
    <svg id="position-mix" width="500"></svg>
  </div>

  <script src="player_stats.js"></script>
  <script src="team_stints.js"></script>
  <script src="team_summary.js"></script>
  <script>
      let removedPlayerIds = [];

      //Render Table Functions
      function renderPlayerTable(data) {
        const tableBody = document.getElementById("player-table-body");
        tableBody.innerHTML = ""; //clears old rows
        for (const player of data){
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${player.Player}</td>
            <td>${player.Team}</td>
            <td>${player.Pos}</td>
            <td>${player.PER}</td>
            <td>${player["TS%"]}</td>
            <td>${player["TRB%"]}</td>
            <td>${player["AST%"]}</td>
            <td>${player["USG%"]}</td>
            <td>${player.WS}</td>
            <td>${player["BPM"]}</td>
          `;
          tableBody.appendChild(row);
        }
      }
      renderPlayerTable(playerStats);
      
      function renderTeamTable(data) {
        const tableBody = document.getElementById("team-table-body");
        tableBody.innerHTML = ""; //clears old rows
        for (const team of data){
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${team["Team"]}</td>
            <td>${team["Players"]}</td>
            <td>${team["Total G"]}</td>
            <td>${team["Avg MP"].toFixed(0)}</td>
            <td>${team["Avg PER"].toFixed(1)}</td>
            <td>${team["Avg TS%"].toFixed(3)}</td>
            <td>${team["Avg USG%"].toFixed(1)}</td>
            <td>${team["Total WS"]}</td>
            <td>${team["Avg WS/48"].toFixed(3)}</td>
            <td>${team["Avg BPM"].toFixed(1)}</td>
            <td>${team["Total VORP"]}</td>
          `;
          tableBody.appendChild(row);
        }
      }
      renderTeamTable(teamSummary);

      

      //Sort Table Functions
      let playerSortDirection = {};
      let teamSortDirection = {};

      function sortPlayerTable(key) {
        playerSortDirection[key] = !playerSortDirection[key]; // flip true/false each click
        const sorted = [...playerStats].sort((a, b) => {
          if (playerSortDirection[key]) {
            return a[key] > b[key] ? 1 : -1;
          } else {
            return a[key] < b[key] ? 1 : -1;
          }
        });
        renderPlayerTable(sorted);
      }

      function sortTeamTable(key) {
        teamSortDirection[key] = !teamSortDirection[key]; // flip true/false each click
        const sorted = [...teamSummary].sort((a, b) => {
          if (teamSortDirection[key]) {
            return a[key] > b[key] ? 1 : -1;
          } else {
            return a[key] < b[key] ? 1 : -1;
          }
        });
        renderTeamTable(sorted);
      }

      //Show Tab Function
      function showTab(tabId){
        const panels = document.querySelectorAll(".tab-panel");
        for (const panel of panels){
          panel.style.display = "none";
        }
        document.getElementById(tabId).style.display = "block";
      }

      showTab("team-analytics");

      //Render Team Scatter Function 
      function renderScatter(xKey, yKey){
        const svg = document.getElementById("team-scatter");
        svg.innerHTML =""; //clears old circle

        const margin = 55;
        const width = 600;
        const height = 400;

        const xValues = teamSummary.map(t => t[xKey]);
        const yValues = teamSummary.map(t => t[yKey]);
        const xMin = Math.min(...xValues);
        const xMax = Math.max(...xValues);
        const yMin = Math.min(...yValues);
        const yMax = Math.max(...yValues);

        function scaleX(value){
          return margin +((value - xMin) / (xMax - xMin)) * (width - 2 * margin);
        }

        function scaleY(value) {
          // inverted
          return height - margin - ((value - yMin) / (yMax - yMin)) * (height - 2 * margin);
        }

        function getTicks(min, max, count){
          const step = (max - min) / (count - 1);
          const ticks = [];
          for (let i = 0; i < count; i++){
            ticks.push(min+step*i);
          }
          return ticks
        }

        const svgNS = "http://www.w3.org/2000/svg";

        //Y-axis gridlines + tick labels
        const yTicks = getTicks(yMin, yMax, 5);
        for (const tick of yTicks){
          const y = scaleY(tick);

          const gridline = document.createElementNS(svgNS, "line");
          gridline.setAttribute("x1", margin);
          gridline.setAttribute("x2", width - margin);
          gridline.setAttribute("y1", y);
          gridline.setAttribute("y2", y);
          gridline.setAttribute("stroke", "#ddd");
          svg.appendChild(gridline);

          const label = document.createElementNS(svgNS, "text");
          label.setAttribute("x", margin - 8);
          label.setAttribute("y", y);
          label.setAttribute("font-size", "10");
          label.setAttribute("text-anchor", "end");
          label.setAttribute("dominant-baseline", "middle");
          label.textContent = tick.toFixed(1);
          svg.appendChild(label);
        }

        // Y-axis title, rotated to read vertically
        const yTitle = document.createElementNS(svgNS, "text");
        yTitle.setAttribute("x", 12);
        yTitle.setAttribute("y", height / 2);
        yTitle.setAttribute("font-size", "11");
        yTitle.setAttribute("text-anchor", "middle");
        yTitle.setAttribute("transform", `rotate(-90 12 ${height / 2})`);
        yTitle.textContent = yKey;
        svg.appendChild(yTitle);

        //X-axis gridlines + tick lines
        const xTicks = getTicks(xMin, xMax, 5);
        for (const tick of xTicks){
          const x = scaleX(tick);

          const gridline = document.createElementNS(svgNS, "line");
          gridline.setAttribute("x1", x);
          gridline.setAttribute("x2", x);
          gridline.setAttribute("y1", margin);
          gridline.setAttribute("y2", height - margin);
          gridline.setAttribute("stroke", "#ddd");
          svg.appendChild(gridline);

          const label = document.createElementNS(svgNS, "text");
          label.setAttribute("x", x);
          label.setAttribute("y", height - margin + 15);
          label.setAttribute("font-size", "10");
          label.setAttribute("text-anchor", "middle");
          label.textContent = tick.toFixed(1);
          svg.appendChild(label);
        }

        //X-Axis Titles
        const xTitle = document.createElementNS(svgNS, "text");
        xTitle.setAttribute("x", width/2);
        xTitle.setAttribute("y", height - 5);
        xTitle.setAttribute("font-size", "11");
        xTitle.setAttribute("text-anchor", "middle");
        xTitle.textContent = xKey;
        svg.appendChild(xTitle);
        
        for (const team of teamSummary) {
          const cx = scaleX(team[xKey]);
          const cy = scaleY(team[yKey]);

          const circle = document.createElementNS(svgNS, "circle");
          circle.setAttribute("cx", cx);
          circle.setAttribute("cy", cy);
          circle.setAttribute("r", 5);
          circle.setAttribute("fill", "steelblue");
          svg.appendChild(circle);

          const label = document.createElementNS(svgNS, "text");
          label.setAttribute("x", cx + 6);
          label.setAttribute("y", cy);
          label.setAttribute("font-size", "10");
          label.textContent = team.Team;
          svg.appendChild(label);
        }
      }

      function updateScatter(){
        const xKey = document.getElementById("x-axis-select").value;
        const yKey = document.getElementById("y-axis-select").value;
        renderScatter(xKey, yKey);
      }

      updateScatter();

      //Render Ranking Chart
      function renderRankingChart(key){
        const svg = document.getElementById("ranking-chart");
        svg.innerHTML = "";
        
        const margin = 100;
        const width = 600;
        const rowHeight = 18;
        const height = teamSummary.length * rowHeight + 20;
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.setAttribute("height", height);

        const sorted = [...teamSummary].sort((a,b) => b[key] - a[key]);
        const maxVal = Math.max(...sorted.map(t => t[key]));
        const svgNS = "http://www.w3.org/2000/svg";
        
        sorted.forEach((team, i) => {
          const y = i *rowHeight;
          const barWidth = (team[key] / maxVal) * (width - margin - 20);

          //Bar
          const bar = document.createElementNS(svgNS, "rect");
          bar.setAttribute("x", margin);
          bar.setAttribute("y", y);
          bar.setAttribute("width", barWidth);
          bar.setAttribute("height", rowHeight - 4);
          bar.setAttribute("fill", "steelblue");
          svg.appendChild(bar);

          //Label
          const label = document.createElementNS(svgNS, "text");
          label.setAttribute("x", margin - 8);
          label.setAttribute("y", y + (rowHeight - 4) / 2);
          label.setAttribute("font-size", "10");
          label.setAttribute("text-anchor", "end");
          label.setAttribute("dominant-baseline", "middle");
          label.textContent = team.Team;
          svg.appendChild(label);

        });
      }

      function updateRankingChart(){
        const key = document.getElementById("metric-select").value;
        renderRankingChart(key);
      }

      updateRankingChart();

      //Player Selector for Radar Chart
      function populatePlayerSelectors(){
        const selectIds = ["player-select-1", "player-select-2", "player-select-3"];
        for (const id of selectIds){
          const select = document.getElementById(id);
          const currentValue = select.value;

          const otherValues = selectIds
            .filter(otherId => otherId !== id)
            .map(otherId => document.getElementById(otherId).value);

          select.innerHTML = "";

          for(const player of playerStats){
            if (otherValues.includes(player["Player ID"])){
              continue;
            }
            const option = document.createElement("option");
            option.value = player["Player ID"];
            option.textContent = player.Player;
            select.appendChild(option);
          }

          if (currentValue) {
            select.value = currentValue;
          }
        }
      }

      populatePlayerSelectors();


      function getSelectedPlayers(){
        const selectIds = ["player-select-1", "player-select-2", "player-select-3"];
        const selectedPlayers = [];
        for (const id of selectIds){
          const selectedId = document.getElementById(id).value;
          const match = playerStats.find(p => p["Player ID"] === selectedId);
          selectedPlayers.push(match);
        }
        return selectedPlayers
      }
      

      const radarStats = ["PER", "TS%", "TRB%", "AST%", "USG%", "WS/48", "BPM"];
      
      //Percentiles
      function getPercentile(key, value){
        const allValues = playerStats.map(p=> p[key]);
        const countBelowOrEqual = allValues.filter(v => v <= value).length;
        return (countBelowOrEqual / allValues.length) * 100;
      }

      
      function getPlayerPercentiles(player){
        const result = {};
        for(const stat of radarStats){
            result[stat] = getPercentile(stat, player[stat])
          }
          return result;
      }

      //Drawing Radar Chart
      function getRadarPoint(index, total, percent, radius, cx, cy){
        const angle = (index / total) * 2 * Math.PI -Math.PI / 2;
        const r = (percent /100 ) * radius;
        return{
          x: cx + r * Math.cos(angle),
          y: cy + r * Math.sin(angle)
        }
      }

      function renderRadarBackground() {
        const svg = document.getElementById("radar-chart");
        svg.innerHTML = "";
        const svgNS = "http://www.w3.org/2000/svg";
        const cx = 250, cy = 250, radius = 180;
        const total = radarStats.length;

        const ringLevels = [25, 50, 75, 100];
        for (const level of ringLevels) {
          let points = "";
          for (let i = 0; i < total; i++) {
            const p = getRadarPoint(i, total, level, radius, cx, cy);
            points += `${p.x},${p.y} `;
          }
          const ring = document.createElementNS(svgNS, "polygon");
          ring.setAttribute("points", points.trim());
          ring.setAttribute("fill", "none");
          ring.setAttribute("stroke", "#ddd");
          svg.appendChild(ring);
        }

        for (let i = 0; i < total; i++) {
          const outer = getRadarPoint(i, total, 100, radius, cx, cy);
          const spoke = document.createElementNS(svgNS, "line");
          spoke.setAttribute("x1", cx);
          spoke.setAttribute("y1", cy);
          spoke.setAttribute("x2", outer.x);
          spoke.setAttribute("y2", outer.y);
          spoke.setAttribute("stroke", "#ccc");
          svg.appendChild(spoke);

          const labelPoint = getRadarPoint(i, total, 115, radius, cx, cy);
          const label = document.createElementNS(svgNS, "text");
          label.setAttribute("x", labelPoint.x);
          label.setAttribute("y", labelPoint.y);
          label.setAttribute("font-size", "11");
          label.setAttribute("text-anchor", "middle");
          label.textContent = radarStats[i];
          svg.appendChild(label);
        }
      }
      
      
      function renderPlayerPolygon(player, color){
        const svg = document.getElementById("radar-chart");
        const svgNS = "http://www.w3.org/2000/svg";
        const cx = 250, cy = 250, radius = 180;
        const total = radarStats.length;

        const percentiles = getPlayerPercentiles(player);

        let points = "";
          
        for (let i = 0; i < total; i++) {
          const percent = percentiles[radarStats[i]]
          const p = getRadarPoint(i, total, percent, radius, cx, cy);
          points += `${p.x},${p.y} `;
        }
        const polygon = document.createElementNS(svgNS, "polygon");
        polygon.setAttribute("points", points.trim());
        polygon.setAttribute("fill", color);
        polygon.setAttribute("fill-opacity", "0.3");
        polygon.setAttribute("stroke", color);
        svg.appendChild(polygon);
      }

      
      //Connecting Dropdowns to chart
      const polygonColors = ["steelblue", "darkorange", "seagreen"];
      function updateRadarChart(){
        renderRadarBackground();
        const players = getSelectedPlayers();
        for(let i = 0; i < polygonColors.length; i++){
          renderPlayerPolygon(players[i],polygonColors[i]);
        }
      }
      updateRadarChart();

      function handlePlayerSelectionChange() {
        populatePlayerSelectors();
        updateRadarChart();
      }

      //****** Roster Lab Stuff *******

      // Figures out the current teams for multi team players
      function buildCurrentTeamMap() {
        const currentTeam = {};
        const minGames = {};

        for (const row of teamStints) {
          const isCombinedRow = row.Team.endsWith("TM");
          if (isCombinedRow) continue;

          const id = row["Player ID"];
          if (!(id in minGames) || row.G < minGames[id]) {
            minGames[id] = row.G;
            currentTeam[id] = row.Team;
          }
        }
        return currentTeam;
      }
      const currentTeamMap = buildCurrentTeamMap();

      //applys buildCurrentTeamMap to all players so we can use playerStats
      for (const player of playerStats){
        player.currentTeam = currentTeamMap[player["Player ID"]] || player.Team;
      }

      //populates the tabs for team select
      function populateTeamSelector(){
        const select = document.getElementById("team-select");
        select.innerHTML = "";

        for(const team of teamSummary){
          const option = document.createElement("option");
          option.value = team.Team;
          option.textContent = team.Team;
          select.appendChild(option);
        }
      }
      populateTeamSelector();

      //Renders the Roster
      function renderRoster(roster){
        const container = document.getElementById("roster-list");
        container.innerHTML="";

        for (const player of roster){
          const row = document.createElement("div");
          row.innerHTML = `${player.Player} - ${player.Pos} - PER ${player.PER} <button onclick="removePlayer('${player["Player ID"]}')">Remove</button>`;
          container.appendChild(row);
        }
      }

      function updateRoster() {
        const teamCode = document.getElementById("team-select").value;
        const roster = getHypotheticalRoster(teamCode);
        renderChips(teamCode);
        renderPositionMix(teamCode);
        renderRoster(roster);
        renderFingerprint(computeFingerprint(roster));
        
      }
      updateRoster(); 

      //Reduce functions
      function average(arr) {
        return arr.reduce((sum, val) => sum + val, 0) / arr.length;
      }
      function total(arr) {
        return arr.reduce((sum, val) => sum + val, 0);
      }

      //Computes the fingerprint
      function computeFingerprint(roster){
        return [
          { label: "Players", value: roster.length, decimals: 0},
          { label: "Avg PER", value: average(roster.map(p => p.PER)), decimals: 1},
          { label: "Avg TS%", value: average(roster.map(p => p["TS%"])), decimals: 3},
          { label: "Avg USG%", value: average(roster.map(p => p["USG%"])), decimals: 1},
          { label: "Total WS", value: total(roster.map(p => p.WS)), decimals: 1},
          { label: "Avg WS/48", value: average(roster.map(p => p["WS/48"])), decimals: 3},
          { label: "Avg BPM", value: average(roster.map(p => p.BPM)), decimals: 1},
          { label: "Total VORP", value: total(roster.map(p => p.VORP)), decimals: 1}
        ]
      }

      //Renders Fingerprint
      function renderFingerprint(tiles){
        const container = document.getElementById("team-fingerprint");
        container.innerHTML="";

        for (const tile of tiles){
          const div = document.createElement("div");
          div.textContent = `${tile.label}: ${tile.value.toFixed(tile.decimals)}`;
          container.appendChild(div);
        }
      }
      
      
      //pulls the Hypo-Roster
      function getHypotheticalRoster(teamCode) {
        const realRoster = playerStats.filter(p => p.currentTeam === teamCode);
        return realRoster.filter(p => !removedPlayerIds.includes(p["Player ID"]));
      }
      //removes players from roster
      function removePlayer(id){
        removedPlayerIds.push(id);
        updateRoster();
      }

      
      function handleTeamChange() {
        removedPlayerIds = [];
        updateRoster();
      }

      //Renders removed players
      function renderChips(teamCode){
        const container = document.getElementById("removed-chips");
        container.innerHTML="";

        const roster = playerStats.filter(p => p.currentTeam === teamCode && removedPlayerIds.includes(p["Player ID"]));
        for(const player of roster){
          const div = document.createElement("div");
          div.innerHTML = `${player.Player} <button onclick="addBackPlayer('${player["Player ID"]}')">Add Back</button>`;
          container.appendChild(div);
        }
      }

      function addBackPlayer(id){
        removedPlayerIds = removedPlayerIds.filter(p => p != id);
        updateRoster();
      }

      //Renders the position mix
      function renderPositionMix(teamCode){
        const svg = document.getElementById("position-mix");
        svg.innerHTML = "";
        const svgNS = "http://www.w3.org/2000/svg";

        const positions = ["PG", "SG", "SF", "PF", "C"];
        const margin = 60;
        const width = 500;
        const rowHeight = 50;
        const height = positions.length * rowHeight + 40;
        svg.setAttribute("viewBox", `0 0  ${width} ${height}`);
        svg.setAttribute("height", height);

        const realRoster = playerStats.filter(p => p.currentTeam === teamCode);
        const hypoRoster = getHypotheticalRoster(teamCode);
        const realCounts = countByPosition(realRoster);
        const hypoCounts = countByPosition(hypoRoster);

        const maxCount = Math.max(...positions.map(pos => Math.max(realCounts[pos], hypoCounts[pos])), 1);
     
        function scaleX(count){
          return margin + (count / maxCount) * (width - margin - 40);
        }

        positions.forEach((pos, i) => {
          const y = i *rowHeight + rowHeight / 2;

          const label = document.createElementNS(svgNS, "text");
          label.setAttribute("x", margin - 10);
          label.setAttribute("y", y);
          label.setAttribute("text-anchor", "end");
          label.setAttribute("dominant-baseline", "middle");
          label.setAttribute("font-size", "12");
          label.textContent = pos;
          svg.appendChild(label);

          const realX = scaleX(realCounts[pos]);
          const hypoX = scaleX(hypoCounts[pos]);

          const line = document.createElementNS(svgNS, "line");
          line.setAttribute("x1", realX);
          line.setAttribute("x2", hypoX);
          line.setAttribute("y1", y);
          line.setAttribute("y2", y);
          line.setAttribute("stroke", "#ccc");
          line.setAttribute("stroke-width", "2")
          svg.appendChild(line);

          const realDot = document.createElementNS(svgNS, "circle");
          realDot.setAttribute("cx", realX);
          realDot.setAttribute("cy", y);
          realDot.setAttribute("r", 6);
          realDot.setAttribute("fill", "steelblue");
          svg.appendChild(realDot);

          const hypoDot = document.createElementNS(svgNS, "circle");
          hypoDot.setAttribute("cx", hypoX);
          hypoDot.setAttribute("cy", y);
          hypoDot.setAttribute("r", 6);
          hypoDot.setAttribute("fill", "darkorange");
          svg.appendChild(hypoDot);

        })
      }

      function countByPosition(roster){
        const counts = {PG: 0, SG: 0, SF: 0, PF:0, C: 0};
        for(const player of roster){
          counts[player.Pos]++;
        }
        return counts;
      }
  </script>
